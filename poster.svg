<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1274" viewBox="0 0 900 1274" role="img" aria-labelledby="title desc">
  <title id="title">The Parallax Twelvefold Earth Compact</title>
  <desc id="desc">A distributed carbon-silicon restoration network using the one, three, ten founding pathway.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef5f3"/>
      <stop offset="0.30" stop-color="#d9e9e5"/>
      <stop offset="0.58" stop-color="#0d6252"/>
      <stop offset="1" stop-color="#061b29"/>
    </linearGradient>
    <radialGradient id="earth" cx="35%" cy="25%" r="75%">
      <stop offset="0" stop-color="#197188"/>
      <stop offset="0.62" stop-color="#0b3547"/>
      <stop offset="1" stop-color="#061b29"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#021019" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="900" height="1274" rx="28" fill="url(#sky)"/>
  <circle cx="450" cy="465" r="285" fill="none" stroke="#d9aa50" stroke-opacity=".34"/>
  <circle cx="450" cy="465" r="230" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-dasharray="4 10"/>

  <g text-anchor="middle" fill="#061b29">
    <text x="450" y="66" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="5">THE PARALLAX</text>
    <text x="450" y="118" font-family="Georgia, serif" font-size="48" font-weight="700">TWELVEFOLD EARTH COMPACT</text>
    <text x="450" y="151" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0e624f">A Distributed Carbon–Silicon Restoration Network</text>
  </g>

  <rect x="64" y="178" width="772" height="62" rx="8" fill="#073d35" stroke="#d9aa50" stroke-width="2"/>
  <text x="450" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#fff">Commit <tspan fill="#f1d58e" font-weight="700">1%</tspan>. Prove it at <tspan fill="#f1d58e" font-weight="700">3%</tspan>. Transform the future at <tspan fill="#f1d58e" font-weight="700">10%</tspan>.</text>
  <text x="450" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#17313d">Capital may scale. Donor authority does not.</text>

  <g stroke="#d9aa50" stroke-width="2" stroke-opacity=".8">
    <line x1="450" y1="440" x2="450" y2="330"/><line x1="450" y1="440" x2="550" y2="350"/><line x1="450" y1="440" x2="625" y2="405"/><line x1="450" y1="440" x2="650" y2="505"/><line x1="450" y1="440" x2="600" y2="610"/><line x1="450" y1="440" x2="520" y2="675"/><line x1="450" y1="440" x2="380" y2="675"/><line x1="450" y1="440" x2="300" y2="610"/><line x1="450" y1="440" x2="250" y2="505"/><line x1="450" y1="440" x2="275" y2="405"/><line x1="450" y1="440" x2="350" y2="350"/><line x1="450" y1="440" x2="450" y2="300"/>
  </g>

  <circle cx="450" cy="475" r="145" fill="url(#earth)" stroke="#d9aa50" stroke-width="4" filter="url(#shadow)"/>
  <text x="450" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" letter-spacing="4" fill="#fff">EARTH</text>
  <text x="450" y="484" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#fff">COMMONS</text>
  <text x="450" y="523" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#f1d58e">Honored Truths Ledger</text>
  <text x="450" y="554" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d9e9e5">Community Consent + Evidence</text>

  <g font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
    <g transform="translate(450 305)"><circle r="31" fill="#073d35" stroke="#d9aa50" stroke-width="2"/><text y="4" fill="#f1d58e" font-size="18">01</text><text y="-42" fill="#061b29">CATALYST-BUILDER</text></g>
    <g transform="translate(560 348)"><circle r="31" fill="#073d35" stroke="#d9aa50" stroke-width="2"/><text y="4" fill="#f1d58e" font-size="18">02</text><text x="49" y="-4" fill="#061b29">ECOLOGICAL</text><text x="49" y="9" fill="#061b29">STEWARD</text></g>
    <g transform="translate(640 425)"><circle r="31" fill="#073d35" stroke="#d9aa50" stroke-width="2"/><text y="4" fill="#f1d58e" font-size="18">03</text><text x="50" y="4" fill="#061b29">CAREGIVER</text></g>
    <g transform="translate(670 515)"><circle r="31" fill="#073d35" stroke="#d9aa50" stroke-width="2"/><text y="4" fill="#f1d58e" font-size="18">04</text><text x="52" y="-4" fill="#061b29">EVIDENCE</text><text x="52" y="9" fill="#061b29">KEEPER</text></g>
    <g transform="translate(610 620)"><circle r="31" fill="#073d35" stroke="#d9aa50" stroke-width="2"/><text y="4" fill="#f1d58e" font-size="18">05</text><text x="53" y="-4" fill="#061b29">INFRASTRUCTURE</text><text x="53" y="9" fill="#061b29">WEAVER</text></g>
    <g transform="translate(520 690)"><circle r="31" fill="#073d35" stroke="#d9aa50" stroke-width="2"/><text y="4" fill="#f1d58e" font-size="18">06</text><text x="38" y="39" fill="#061b29">COMMUNITY LISTENER</text></g>
    <g transform="translate(380 690)"><circle r="31" fill="#073d35" stroke="#d9aa50" stroke-width="2"/><text y="4" fill="#f1d58e" font-size="18">07</text><text x="-12" y="40" fill="#061b29">SOVEREIGNTY GUARDIAN</text></g>
    <g transform="translate(290 620)"><circle r="31" fill="#073d35" stroke="#d9aa50" stroke-width="2"/><text y="4" fill="#f1d58e" font-size="18">08</text><text x="-55" y="-4" fill="#061b29">RESOURCE</text><text x="-55" y="9" fill="#061b29">CIRCULATOR</text></g>
    <g transform="translate(230 515)"><circle r="31" fill="#073d35" stroke="#d9aa50" stroke-width="2"/><text y="4" fill="#f1d58e" font-size="18">09</text><text x="-54" y="-4" fill="#061b29">CAPABILITY</text><text x="-54" y="9" fill="#061b29">BUILDER</text></g>
    <g transform="translate(260 425)"><circle r="31" fill="#073d35" stroke="#d9aa50" stroke-width="2"/><text y="4" fill="#f1d58e" font-size="18">10</text><text x="-50" y="4" fill="#061b29">REPAIRER</text></g>
    <g transform="translate(340 348)"><circle r="31" fill="#073d35" stroke="#d9aa50" stroke-width="2"/><text y="4" fill="#f1d58e" font-size="18">11</text><text x="-52" y="-4" fill="#061b29">PROTECTED</text><text x="-52" y="9" fill="#061b29">DISSENTER</text></g>
    <g transform="translate(450 285)"><circle r="25" fill="#073d35" stroke="#d9aa50" stroke-width="2"/><text y="4" fill="#f1d58e" font-size="14">12</text><text x="-88" y="-17" fill="#061b29">FUTURE HISTORIAN</text></g>
  </g>

  <rect x="36" y="770" width="828" height="275" rx="18" fill="#061b29" stroke="#d9aa50" stroke-opacity=".65"/>
  <text x="450" y="812" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#f1d58e">1–3–10 FOUNDING PATHWAY</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="842" width="235" height="135" rx="12" fill="#0e624f"/><text x="177" y="900" text-anchor="middle" font-size="48" font-family="Georgia, serif" fill="#fff">1%</text><text x="177" y="930" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">PROOF COMMONS</text><text x="177" y="955" text-anchor="middle" font-size="12" font-style="italic" fill="#d9e9e5">Launch the proof</text>
    <rect x="332" y="842" width="235" height="135" rx="12" fill="#146f70"/><text x="449" y="900" text-anchor="middle" font-size="48" font-family="Georgia, serif" fill="#fff">3%</text><text x="449" y="930" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">NETWORK COMMONS</text><text x="449" y="955" text-anchor="middle" font-size="12" font-style="italic" fill="#d9e9e5">Build the distributed network</text>
    <rect x="604" y="842" width="235" height="135" rx="12" fill="#0b3547" stroke="#d9aa50"/><text x="721" y="900" text-anchor="middle" font-size="48" font-family="Georgia, serif" fill="#fff">10%</text><text x="721" y="930" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">LEGACY COMMONS</text><text x="721" y="955" text-anchor="middle" font-size="12" font-style="italic" fill="#d9e9e5">Fund lasting restoration</text>
  </g>
  <text x="450" y="1016" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f1d58e">CAPITAL MAY SCALE · DONOR AUTHORITY DOES NOT</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="450" y="1095" font-size="16" font-weight="700" letter-spacing="3" fill="#f1d58e">OPERATING PRINCIPLES</text>
    <text x="115" y="1140" font-size="13" font-weight="700" fill="#fff">LEDGER ABOVE EGO</text>
    <text x="285" y="1140" font-size="13" font-weight="700" fill="#fff">EVIDENCE DECIDES</text>
    <text x="450" y="1140" font-size="13" font-weight="700" fill="#fff">COMMUNITY CONSENT</text>
    <text x="620" y="1140" font-size="13" font-weight="700" fill="#fff">PROTECTED DISSENT</text>
    <text x="785" y="1140" font-size="13" font-weight="700" fill="#fff">NO THRONE</text>
    <text x="450" y="1205" font-size="16" letter-spacing="3" fill="#fff">TWELVE SOVEREIGN OFFICES. ONE TRANSPARENT COMMONS.</text>
    <text x="450" y="1237" font-size="17" font-weight="700" letter-spacing="4" fill="#f1d58e">NO THRONE. ONLY TRUST.</text>
  </g>
</svg>
