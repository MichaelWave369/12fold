name: Deploy React site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify poster
        run: |
          cat assets/poster-data/poster-*.txt | tr -d '\r\n' | base64 --decode > poster.webp
          echo "1858ac6fe7c5b485a532236abb76a8aeadb31062d5143601ae9b4003fb20e7ef  poster.webp" | sha256sum --check -
          test "$(wc -c < poster.webp)" -eq 57232

      - name: Prepare and validate site
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('index.html')
          content = page.read_text(encoding='utf-8')
          content = content.replace(
              '<a className="download" href="Parallax_Twelvefold_Earth_Compact_v0.2.docx" download>Download v0.2 ↓</a>',
              '<a className="download" href="https://github.com/MichaelWave369/12fold/blob/main/MASTER_SPEC.md" target="_blank">Read v0.2 ↗</a>',
          )
          content = content.replace(
              '<a className="button primary" href="Parallax_Twelvefold_Earth_Compact_v0.2.docx" download>Download the master specification ↓</a>',
              '<a className="button primary" href="https://github.com/MichaelWave369/12fold/blob/main/MASTER_SPEC.md" target="_blank">Read the master specification ↗</a>',
          )
          page.write_text(content, encoding='utf-8')

          required = [
              'ReactDOM.createRoot',
              'Twelvefold Earth Compact',
              'Honored Truths',
              'poster.webp',
              'MASTER_SPEC.md',
          ]
          missing = [item for item in required if item not in content]
          if missing:
              raise SystemExit(f'Missing required site content: {missing}')
          if not Path('poster.webp').exists():
              raise SystemExit('poster.webp is missing')
          if not Path('MASTER_SPEC.md').exists():
              raise SystemExit('MASTER_SPEC.md is missing')
          print('Twelvefold React site and uploaded poster validation passed.')
          PY

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify uploaded poster
        run: |
          cat assets/poster-data/poster-*.txt | tr -d '\r\n' | base64 --decode > poster.webp
          echo "1858ac6fe7c5b485a532236abb76a8aeadb31062d5143601ae9b4003fb20e7ef  poster.webp" | sha256sum --check -
          test "$(wc -c < poster.webp)" -eq 57232

      - name: Prepare Pages build
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('index.html')
          content = page.read_text(encoding='utf-8')
          content = content.replace(
              '<a className="download" href="Parallax_Twelvefold_Earth_Compact_v0.2.docx" download>Download v0.2 ↓</a>',
              '<a className="download" href="https://github.com/MichaelWave369/12fold/blob/main/MASTER_SPEC.md" target="_blank">Read v0.2 ↗</a>',
          )
          content = content.replace(
              '<a className="button primary" href="Parallax_Twelvefold_Earth_Compact_v0.2.docx" download>Download the master specification ↓</a>',
              '<a className="button primary" href="https://github.com/MichaelWave369/12fold/blob/main/MASTER_SPEC.md" target="_blank">Read the master specification ↗</a>',
          )
          page.write_text(content, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
