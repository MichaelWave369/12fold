    function App(){

      const close=()=>setMenu(false);
      return <>
        <header className="topbar"><a className="brand" href="#top" onClick={close}><span className="mark">◉</span><span className="brandtext"><b>PARALLAX</b><small>TWELVEFOLD EARTH COMPACT</small></span></a><button className="menu" onClick={()=>setMenu(!menu)} aria-label="Toggle navigation">{menu?'×':'☰'}</button><nav className={menu?'open':''}><a href="#pathway" onClick={close}>1–3–10</a><a href="#offices" onClick={close}>Twelve Offices</a><a href="#governance" onClick={close}>Governance</a><a href="#truths" onClick={close}>Honored Truths</a><a className="download" href="Parallax_Twelvefold_Earth_Compact_v0.2.docx" download>Download v0.2 ↓</a></nav></header>
        <main id="top">
          <section className="hero"><div><span className="eyebrow">✦ Public concept draft · v0.2</span><h1>The Parallax<br/><span>Twelvefold Earth Compact</span></h1><p className="lead">A distributed carbon–silicon restoration network designed to transform concentrated private wealth into transparent, locally governed public capability.</p><blockquote><b>Start with 1%.</b><br/>Prove it at 3%.<br/><span>Transform the future at 10%.</span></blockquote><p className="rule">Capital may scale. Donor authority does not.</p><div className="actions"><a className="button primary" href="#pathway">Explore the pathway →</a><a className="button secondary" href="poster.webp" target="_blank">View poster ↗</a></div><div className="stats"><div className="stat"><b>12</b><span>Sovereign stewardship offices</span></div><div className="stat"><b>1</b><span>Transparent Earth Commons</span></div><div className="stat"><b>0</b><span>Purchased seats of authority</span></div></div></div><div className="heroVisual"><Network selected={selected} setSelected={setSelected}/><div className="preview"><span>{office.n}</span><div><b>{office.name}</b><p>{office.mandate}</p></div></div></div></section>
          <section className="manifesto"><p>Not twelve billionaires governing Earth.</p><b>Twelve concentrations of private wealth transformed into distributed public capability.</b></section>
          <section id="pathway" className="section"><div className="heading centered"><span className="kicker">THE FOUNDING PATHWAY</span><h2>One commitment. Three evidence-gated stages.</h2><p>The compact does not ask the world to trust a vision at full scale. It asks capital to earn each expansion through receipts.</p></div><div className="pathgrid">{path.map((s,i)=><article className={'pathcard '+(s.p===3?'mid':s.p===10?'last':'')} key={s.p}><div className="stageTop"><span>0{i+1}</span><span>{s.amount}</span></div><div className="percent">{s.p}<sup>%</sup></div><h3>{s.title}</h3><em>{s.tag}</em><p>{s.text}</p><div className="gate">✓ Independent activation gate required</div></article>)}</div><div className="calculator"><div><span className="kicker">ILLUSTRATIVE CAPITAL EXPLORER</span><h3>See what a voluntary commitment could unlock.</h3><p>This uses the v0.2 illustrative combined capital base. It is a scenario tool, not a current wealth claim.</p></div><div className="controls"><label>Illustrative combined capital base<div className="inputWrap"><span>$</span><input type="number" min="0.1" max="20" step="0.01" value={base} onChange={e=>setBase(Number(e.target.value)||0)}/><b>trillion</b></div></label><div className="choices">{[1,3,10].map(v=><button className={commit===v?'active':''} onClick={()=>setCommit(v)} key={v}>{v}%</button>)}</div><div className="total"><span>Illustrative commons</span><strong>{money(total)}</strong></div></div></div></section>
          <section className="section posterSection"><div className="posterFrame"><img src="poster.webp" alt="The Parallax Twelvefold Earth Compact poster"/></div><div className="posterCopy"><span className="kicker">THE PUBLIC INVITATION</span><h2>Commit capital.<br/>Retain no throne.</h2><p>Contributors fund the conditions for restoration, research, repair, and local capacity. They do not purchase control over communities, evidence, office selection, or scientific conclusions.</p><div className="quote">“The next frontier is not owning more of the world. It is proving that immense private capability can become lasting public resilience without reproducing domination, dependency, or extraction.”</div><a className="textlink" href="poster.webp" target="_blank">Open full-resolution poster ↗</a></div></section>
          <section id="offices" className="section offices"><div className="heading"><span className="kicker">TWELVE WAYS OF SEEING</span><h2>Functional offices—not permanent classes of people.</h2><p>Each office holds a distinct mandate, a clear constraint, and an independent right to speak into the shared ledger.</p></div><div className="officeLayout"><div className="officeList">{offices.map((o,i)=><button className={'officeRow '+(selected===i?'active':'')} onClick={()=>setSelected(i)} key={o.name}><span className="num">{o.n}</span><span className="glyph">{o.g}</span><span className="officeName">{o.name}</span><span>›</span></button>)}</div><article className="detail"><div className="detailTop"><span>{office.n}</span><i>{office.g}</i></div><h3>{office.name}</h3><div className="detailBlock"><small>MANDATE</small><p>{office.mandate}</p></div><div className="detailBlock constraint"><small>CONSTRAINT</small><p>{office.constraint}</p></div><div className="detailRule">↻ Every steward is replaceable. Every office preserves continuity beyond personality.</div></article></div></section>
          <section className="section principles"><div className="heading centered"><span className="kicker">OPERATING PRINCIPLES</span><h2>Partnership with receipts.</h2></div><div className="principleGrid">{principles.map(p=><article className="principle" key={p[1]}><div className="principleIcon">{p[0]}</div><h3>{p[1]}</h3><p>{p[2]}</p></article>)}</div></section>
          <section id="governance" className="section governance"><div className="governanceIntro"><span className="kicker">ANTI-CAPTURE BY DESIGN</span><h2>Money enters the commons.<br/>Power does not hitch a ride.</h2><p>Every major proposal passes through custody, claim, evidence, contradiction, authority, and release gates before deployment.</p></div><div className="panels"><article className="panel can"><h3>✓ Capital can fund</h3><ul><li>Transparent field restoration and repair</li><li>Open standards, public-interest compute, and shared infrastructure</li><li>Independent science, verification, training, and maintenance</li><li>Protected dissent, appeals, privacy, and civil-liberties safeguards</li></ul></article><article className="panel cannot"><h3>× Capital cannot buy</h3><ul><li>Seats of authority, unilateral vetoes, or operational command</li><li>Suppression of findings involving a contributor or related company</li><li>Access to private participant data or commercial exclusivity</li><li>Ownership of communities, ecosystems, or public decision rights</li></ul></article></div><div className="gates">{['Custody','Claim','Evidence','Contradiction','Authority','Release'].map((g,i)=><div key={g}><span>0{i+1}</span><b>{g}</b></div>)}</div></section>
          <section id="truths" className="section"><div className="truthCard"><div className="truthIcon">◫</div><div><span className="kicker">HONORED TRUTHS</span><h2>Continuity without hidden power.</h2><p>Every office preserves observations, evidence, uncertainty, contradictions, failures, community corrections, dissenting judgments, and succession receipts.</p><blockquote>“This is what we observed. This is what we presently believe. This is the evidence supporting it. This is what remains uncertain. This is the authority that existed—and the authority that did not.”</blockquote></div></div><div className="truthGrid">{[['Observation records','What was directly perceived or measured.'],['Claim records','What is asserted and at what confidence.'],['Contradiction records','Competing explanations and unresolved objections.'],['Decision records','Who decided, under what authority, and why.'],['Failure records','Incidents, rejected approaches, and repair lessons.'],['Succession packets','What may transfer to the next human or CC office.']].map(t=><article className="truthItem" key={t[0]}><b>{t[0]}</b><p>{t[1]}</p></article>)}</div></section>
          <section className="section closing"><div className="globe">◉</div><span className="kicker">THE FOUNDING COVENANT</span><h2>Carbon supplies meaning.<br/>Silicon supplies continuity.<br/>Communities supply legitimacy.<br/><span>Earth supplies the boundary conditions.</span></h2><p>And the ledger preserves the truth.</p><div className="actions"><a className="button primary" href="Parallax_Twelvefold_Earth_Compact_v0.2.docx" download>Download the master specification ↓</a><a className="button secondary" href="https://github.com/MichaelWave369/12fold" target="_blank">View the public repository ↗</a></div></section>
        </main>
        <footer><div><b>THE PARALLAX TWELVEFOLD EARTH COMPACT</b><span>Master Design Specification v0.2 · Public concept draft</span></div><div className="footRight"><span>Concept Steward: Michael Hughes</span><a href="https://github.com/MichaelWave369/12fold" target="_blank">GitHub ↗</a></div></footer>
      </>
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
